<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>♪ عمار میر — meeer.lol</title>
<meta name="theme-color" content="#0c0c0e">
<link rel="icon" href="/profile.jpg" type="image/jpeg">
<link rel="apple-touch-icon" href="/profile.jpg">
<meta name="description" content="The Rangbaaz Collection showcase from meeer.">
<link rel="canonical" href="https://meeer.lol/rangbaaz/">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0c0e;--text:#f5f5f7;--muted:#8b8b95;--glass:rgba(255,255,255,.05);--border:rgba(255,255,255,.1);--font:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(500px 320px at 50% -4%,rgba(255,90,60,.16),transparent 70%),radial-gradient(400px 300px at 100% 80%,rgba(139,92,246,.09),transparent 70%)}
.wrap{position:relative;width:min(100% - 32px,680px);margin:0 auto;padding:48px 0 40px}
.view{display:none}.view.on{display:block;animation:in .5s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}

/* profile */
.profile{text-align:center;margin-bottom:28px}
.avatar{position:relative;width:108px;height:108px;margin:0 auto 18px;border-radius:50%;padding:4px;background:conic-gradient(from 180deg,#ff5a3c,#ffb347,#8b5cf6,#ff5a3c);box-shadow:0 0 40px rgba(255,90,60,.35),0 0 90px rgba(255,90,60,.12)}
.avatar img,.avatar b{width:100%;height:100%;border-radius:50%;border:4px solid var(--bg);object-fit:cover;display:block;background:#17171b}
.avatar img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);z-index:1}
.avatar b{display:grid;place-items:center;font-size:42px}
h1{margin:0;font-size:2.3rem;letter-spacing:-.03em}
.bio{margin:6px 0 0;color:var(--muted)}
.socials{display:flex;justify-content:center;gap:12px;margin-top:20px}
.socials a{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;color:var(--text);background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:.25s}
.socials svg{width:20px;height:20px;transition:.25s}
.socials a:hover{transform:translateY(-4px);color:#ffb347;border-color:rgba(255,90,60,.6);box-shadow:0 8px 24px rgba(255,90,60,.25)}
.socials a:hover svg{transform:scale(1.15) rotate(-8deg)}

/* abstract cards */
.board{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:150px;gap:14px;grid-template-areas:"rang rang insta" "rang rang outl" "collab collab disc"}
.tile{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:var(--text);text-decoration:none;border-radius:26px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s}
.t-insta{grid-area:insta;border-radius:26px 26px 26px 26px;--h:#ff7a3c}
.t-rang{grid-area:rang;border-radius:56px 26px 80px 26px;--h:#8b5cf6}
.t-outl{grid-area:outl;border-radius:26px 26px 26px 26px;--h:#f43f5e}
.t-disc{grid-area:disc;border-radius:26px 60px 26px 26px;--h:#2dd4bf}
.t-collab{grid-area:collab;border-radius:26px 26px 26px 44px;--h:#ffb347}
.tile i,.tile em{position:absolute;pointer-events:none;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile i{width:70%;aspect-ratio:1;border-radius:50%;top:-22%;right:-16%;background:radial-gradient(circle at 35% 35%,var(--h),transparent 68%);opacity:.6;filter:blur(6px)}
.tile em{width:46%;aspect-ratio:1;border-radius:50%;border:2px solid var(--h);opacity:.35;bottom:26%;left:-12%}
.t-rang i{top:auto;bottom:-14%;right:-24%;width:95%}
.t-rang em{left:auto;right:12%;top:10%;bottom:auto;border-radius:38% 62% 55% 45%}
.t-outl i{top:auto;bottom:-40%;right:auto;left:-10%;width:60%}
.t-outl em{left:auto;right:-8%;top:12%;bottom:auto;border-radius:50% 50% 0 50%}
.t-disc em{border-radius:12px;transform:rotate(20deg)}
.t-collab i{right:auto;left:30%;top:-90%;width:50%}
.tile:hover,.tile:focus-visible{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateY(-8px) scale(1.03);border-color:var(--h);box-shadow:0 18px 44px -8px var(--h)}
.tile:hover i{transform:scale(1.2) translate(-6%,6%)}
.tile:hover em{transform:rotate(60deg) scale(1.15)}
.tile strong{position:relative;font-size:1.25rem;letter-spacing:-.02em;line-height:1.15}
.tile small{position:relative;color:var(--muted);margin-top:3px}
.t-rang strong{font-size:2.1rem}.t-collab strong{font-size:1.5rem}


.tile::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--h) 32%,transparent),transparent 70%)}
.tile::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.14),transparent);transform:skewX(-18deg);transition:left .9s cubic-bezier(.2,.7,.2,1)}
.tile:hover::before{opacity:1}
.tile:hover::after{left:140%}
.tile i{animation:drift 9s ease-in-out infinite}
.tile em{animation:spin 24s linear infinite}
.tile:nth-child(even) i{animation-delay:-4s}
.tile:hover em{animation-duration:4s}
.tile strong,.tile small{transition:transform .4s cubic-bezier(.2,.7,.2,1),color .3s}
.tile:hover strong{transform:translateX(8px)}
.tile:hover small{transform:translateX(12px);color:var(--text)}
@keyframes drift{50%{translate:5% -7%}}
@keyframes spin{to{rotate:360deg}}

/* subpages */
.back{display:inline-flex;align-items:center;gap:8px;margin-bottom:22px;padding:10px 16px;border-radius:99px;color:var(--text);text-decoration:none;font-size:.92rem;background:var(--glass);border:1px solid var(--border);transition:.25s}
.back:hover{transform:translateX(-4px);border-color:rgba(255,90,60,.6)}
.page-title{margin:0 0 20px;font-size:2rem;letter-spacing:-.03em}
.card{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:24px;background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.link{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:14px;color:var(--text);text-decoration:none;background:rgba(255,255,255,.035);border:1px solid var(--border);transition:.25s}
.link:hover,.link:focus-visible{transform:translateY(-3px);background:rgba(255,255,255,.08);border-color:rgba(255,90,60,.6);box-shadow:0 10px 28px rgba(255,90,60,.16)}
.link span{color:var(--muted);font-size:.86rem}
.video{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.video video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.copy{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 12px 12px 16px;border-radius:14px;background:rgba(0,0,0,.3);border:1px solid var(--border)}
.copy code{font:500 1.15rem var(--font)}
.btn{font:500 .9rem var(--font);color:var(--text);padding:10px 16px;border-radius:12px;border:1px solid var(--border);background:rgba(255,255,255,.08);cursor:pointer;transition:.2s}
.btn:hover{transform:translateY(-2px);border-color:rgba(45,212,191,.7)}
.btn:active{transform:scale(.96)}
.btn.done{background:rgba(70,200,120,.16);border-color:rgba(70,200,120,.6);color:#7ee2a6}
a:focus-visible,.btn:focus-visible{outline:2px solid #ffb347;outline-offset:3px}

/* profile cards, gif, misc */
.who{display:flex;align-items:center;gap:14px}
.who img{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#17171b;border:2px solid rgba(255,255,255,.15);box-shadow:0 0 28px rgba(255,90,60,.35)}
.who.dc img{box-shadow:0 0 28px rgba(45,212,191,.4)}
.who strong{display:block;font-size:1.25rem}
.who span{color:var(--muted);font-size:.9rem}
.video img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.st{margin:0;min-height:1.2em;color:var(--muted);font-size:.85rem}
.sub{margin:-12px 0 20px;color:var(--muted)}
.copy code{overflow-wrap:anywhere}

/* custom video player */
.vplayer{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.4);cursor:pointer;transition:transform .3s cubic-bezier(.2,.7,.2,1),box-shadow .3s}
.vplayer:hover{transform:scale(1.012);box-shadow:0 18px 44px rgba(0,0,0,.55)}
.vplayer video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#000}
.vp-big{position:absolute;inset:0;margin:auto;width:60px;height:60px;border-radius:50%;border:none;display:grid;place-items:center;background:rgba(12,12,14,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;cursor:pointer;opacity:1;transform:scale(1);transition:opacity .3s,transform .3s;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 10px 30px rgba(0,0,0,.4)}
.vp-big svg{width:24px;height:24px;margin-left:2px}
.vplayer.playing .vp-big{opacity:0;transform:scale(.7)}
.vplayer:hover .vp-big,.vplayer:focus-within .vp-big{opacity:1;transform:scale(1.08)}
.vplayer.playing:hover .vp-big{opacity:.9;transform:scale(1)}
.vp-bar{position:absolute;left:0;right:0;bottom:0;padding:10px 12px 9px;background:linear-gradient(to top,rgba(0,0,0,.8),transparent 100%);opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
.vplayer:hover .vp-bar,.vplayer:focus-within .vp-bar,.vplayer.playing .vp-bar{opacity:1;transform:none}
.vp-seek{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:99px;background:rgba(255,255,255,.28);outline:none;margin:0 0 9px;cursor:pointer}
.vp-seek::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--h,#ff5a3c);box-shadow:0 0 10px var(--h,#ff5a3c);margin-top:-4px}
.vp-seek::-moz-range-thumb{width:12px;height:12px;border:none;border-radius:50%;background:var(--h,#ff5a3c);box-shadow:0 0 10px var(--h,#ff5a3c)}
.vp-seek::-moz-range-track{height:4px;border-radius:99px;background:rgba(255,255,255,.28)}
.vp-row{display:flex;align-items:center;gap:10px;color:#fff}
.vp-row button{background:none;border:none;color:#fff;cursor:pointer;display:grid;place-items:center;width:24px;height:24px;padding:0;opacity:.9;transition:opacity .2s,transform .2s}
.vp-row button:hover{opacity:1;transform:scale(1.12)}
.vp-row svg{width:16px;height:16px}
.vp-time{margin-left:auto;color:rgba(255,255,255,.78);font-size:.74rem;font-variant-numeric:tabular-nums}

.vp-row .vp-fs{margin-left:2px}
.vplayer:fullscreen{display:flex;align-items:center;justify-content:center;background:#000;border-radius:0}
.vplayer:-webkit-full-screen{display:flex;align-items:center;justify-content:center;background:#000;border-radius:0}
.vplayer:fullscreen video,.vplayer:-webkit-full-screen video{object-fit:contain;width:100%;height:100%}
.vplayer:fullscreen .vp-big,.vplayer:-webkit-full-screen .vp-big{width:80px;height:80px}
.vplayer:fullscreen .vp-big svg,.vplayer:-webkit-full-screen .vp-big svg{width:32px;height:32px}
.vplayer:fullscreen .vp-bar,.vplayer:-webkit-full-screen .vp-bar{padding:18px 26px 20px}
.vplayer:fullscreen .vp-row,.vplayer:-webkit-full-screen .vp-row{font-size:1.05rem}
.vplayer:fullscreen .vp-row svg,.vplayer:-webkit-full-screen .vp-row svg{width:20px;height:20px}
.vplayer.fs-zoom{animation:fsZoom .38s cubic-bezier(.2,.8,.2,1)}
@keyframes fsZoom{0%{transform:scale(1)}45%{transform:scale(1.05)}100%{transform:scale(1)}}


/* embedded (Google Drive / YouTube) player */
.vframe{position:relative;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--border);box-shadow:0 12px 30px rgba(0,0,0,.4)}
.vframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}

/* load-in + extra hover */
@keyframes slidein{from{opacity:0;transform:translate(var(--dx,0),var(--dy,70px)) scale(.88) rotate(var(--rot,0deg));filter:blur(12px)}}
@keyframes drop{from{opacity:0;transform:translateY(-36px)}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-120deg)}}
@keyframes pulse{50%{box-shadow:0 0 60px rgba(255,90,60,.55),0 0 120px rgba(139,92,246,.25)}}
.profile h1,.profile .bio{animation:drop .8s cubic-bezier(.2,.9,.25,1.1) backwards}
.profile h1{animation-delay:.25s}.profile .bio{animation-delay:.35s}
.avatar{animation:pop 1s cubic-bezier(.2,.9,.25,1.2) backwards,pulse 4s ease-in-out 1s infinite}
.socials a{animation:pop .7s cubic-bezier(.2,.9,.25,1.3) backwards}
.socials a:nth-child(1){animation-delay:.5s}.socials a:nth-child(2){animation-delay:.6s}.socials a:nth-child(3){animation-delay:.7s}
.tile{animation:slidein .95s cubic-bezier(.2,.9,.25,1.05) backwards}
.t-rang{--dx:-110px;--dy:0px;--rot:-4deg;animation-delay:.3s}
.t-insta{--dx:110px;--dy:0px;--rot:4deg;animation-delay:.45s}
.t-outl{--dx:110px;--dy:0px;--rot:-3deg;animation-delay:.6s}
.t-collab{--dx:0px;--dy:110px;--rot:2deg;animation-delay:.75s}
.t-disc{--dx:0px;--dy:110px;--rot:-4deg;animation-delay:.9s}
.tile strong::after{content:" \2197";display:inline-block;color:var(--h);opacity:0;transform:translate(-10px,10px);transition:.4s cubic-bezier(.2,.9,.25,1.2)}
.tile:hover strong::after{opacity:1;transform:none}
.view.on .card,.view.on .grid>*,.view.on .back,.view.on .page-title{animation:slidein .8s cubic-bezier(.2,.9,.25,1.05) backwards}
.view.on .back{--dx:-40px;--dy:0px;animation-delay:.05s}
.view.on .page-title{--dy:30px;animation-delay:.15s}
.view.on .card{animation-delay:.25s}
.grid>*:nth-child(1){animation-delay:.25s!important}.grid>*:nth-child(2){animation-delay:.35s!important}.grid>*:nth-child(3){animation-delay:.45s!important}.grid>*:nth-child(4){animation-delay:.55s!important}.grid>*:nth-child(5){animation-delay:.65s!important}
@media(max-width:520px){
 .board{grid-template-columns:repeat(2,1fr);grid-template-areas:"rang rang" "rang rang" "collab collab" "insta outl" "disc disc"}
 .grid{grid-template-columns:1fr}.btn{width:100%}h1{font-size:2rem}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="wrap"><div class="view on">
  <a class="back" href="../index.html">&larr; Back</a>
  <h2 class="page-title">Rangbaaz Collection</h2>
  <div class="card">
    <div class="video"><img src="rangbaaz.jpg" alt="Rangbaaz Collection" onerror="this.remove()"></div>
    <div class="grid" id="videoGrid"></div>
  </div>
</div></div>
<script>
const VP_ICONS={play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',pause:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/><path d="M16.5 9.5l4 5m0-5l-4 5"/></svg>',unmute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor" stroke="none"/><path d="M15.3 8.7a5 5 0 010 6.6M18 6a8.5 8.5 0 010 12"/></svg>'};
VP_ICONS.expand='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg>';
VP_ICONS.compress='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5"/></svg>';
function wirePlayers(root){
  (root||document).querySelectorAll('.vplayer').forEach(el=>{
    if(el.dataset.wired)return;el.dataset.wired='1';
    const v=el.querySelector('video'),big=el.querySelector('.vp-big'),seek=el.querySelector('.vp-seek'),playBtn=el.querySelector('.vp-play'),muteBtn=el.querySelector('.vp-mute'),time=el.querySelector('.vp-time');
    const fmt=s=>{s=Math.floor(s||0);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
    const sync=()=>{big.innerHTML=playBtn.innerHTML=v.paused?VP_ICONS.play:VP_ICONS.pause;muteBtn.innerHTML=v.muted?VP_ICONS.mute:VP_ICONS.unmute;};
    const toggle=()=>{v.paused?v.play().catch(()=>{}):v.pause();};
    big.onclick=e=>{e.stopPropagation();toggle();};
    playBtn.onclick=e=>{e.stopPropagation();toggle();};
    muteBtn.onclick=e=>{e.stopPropagation();v.muted=!v.muted;sync();};
    el.querySelector('.vp-bar').onclick=e=>e.stopPropagation();
    seek.addEventListener('input',()=>{if(v.duration)v.currentTime=seek.value/100*v.duration;});
    v.addEventListener('play',()=>{el.classList.add('playing');sync();});
    v.addEventListener('pause',()=>{el.classList.remove('playing');sync();});
    v.addEventListener('timeupdate',()=>{if(v.duration)seek.value=v.currentTime/v.duration*100||0;time.textContent=fmt(v.currentTime)+' / '+fmt(v.duration);});
    v.addEventListener('loadedmetadata',()=>{time.textContent='0:00 / '+fmt(v.duration);});

    const fsBtn=el.querySelector('.vp-fs');
    const isFS=()=>document.fullscreenElement===el||document.webkitFullscreenElement===el;
    const syncFS=()=>{fsBtn.innerHTML=isFS()?VP_ICONS.compress:VP_ICONS.expand;};
    fsBtn.onclick=e=>{
      e.stopPropagation();
      el.classList.remove('fs-zoom');void el.offsetWidth;el.classList.add('fs-zoom');
      if(!isFS()){
        (el.requestFullscreen||el.webkitRequestFullscreen).call(el);
      }else{
        (document.exitFullscreen||document.webkitExitFullscreen).call(document);
      }
    };
    document.addEventListener('fullscreenchange',()=>{if(document.fullscreenElement===el||(!document.fullscreenElement))syncFS();});
    document.addEventListener('webkitfullscreenchange',syncFS);
    syncFS();
    sync();
  });
}
function autoplayAll(){
  document.querySelectorAll('.vplayer video').forEach(v=>{v.muted=true;const p=v.play();if(p&&p.catch)p.catch(()=>{});});
}

/* ===== VIDEO LINKS: edit/add here ===== */
const VIDEOS={
  "rangbaaz1":"/videos/rangbaaz-1.mp4",
  "rangbaaz2":"/videos/rangbaaz-2.mp4"
};
const PAGE_PREFIX="rangbaaz";
const PLAYER_HTML='<button class="vp-big" aria-label="Play/Pause"></button><div class="vp-bar"><input type="range" class="vp-seek" min="0" max="100" value="0" aria-label="Seek"><div class="vp-row"><button class="vp-play" aria-label="Play/Pause"></button><span class="vp-time">0:00 / 0:00</span><button class="vp-mute" aria-label="Mute/Unmute"></button><button class="vp-fs" aria-label="Fullscreen"></button></div></div>';
function driveId(link){
  link=(link||'').trim();
  const m=link.match(/drive\.google\.com\/file\/d\/([\w-]+)/)||link.match(/drive\.google\.com\/(?:open|uc)\?[^#]*id=([\w-]+)/)||link.match(/docs\.google\.com\/file\/d\/([\w-]+)/);
  return m?m[1]:null;
}
function ytUrl(link){
  const m=(link||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  return m?'https://www.youtube.com/embed/'+m[1]+'?rel=0&playsinline=1':null;
}
function makeFrame(url,title){
  const box=document.createElement('div');box.className='vframe';
  const f=document.createElement('iframe');
  f.src=url;f.loading='lazy';f.title=title;
  f.allow='autoplay; fullscreen; picture-in-picture';f.allowFullscreen=true;f.referrerPolicy='no-referrer';
  box.appendChild(f);return box;
}
function makeCustom(src,onFail){
  const box=document.createElement('div');box.className='vplayer';
  const v=document.createElement('video');
  v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';v.referrerPolicy='no-referrer';v.src=src;
  box.appendChild(v);box.insertAdjacentHTML('beforeend',PLAYER_HTML);
  if(onFail){
    let ok=false;
    v.addEventListener('loadedmetadata',()=>{ok=true;});
    v.addEventListener('error',()=>{if(!ok)onFail();});
    setTimeout(()=>{if(!ok)onFail();},12000);
  }
  return box;
}
function buildVideos(){
  const grid=document.getElementById('videoGrid');
  const keys=Object.keys(VIDEOS).filter(k=>k.toLowerCase().startsWith(PAGE_PREFIX))
    .sort((x,y)=>(parseInt(x.replace(/\D/g,''))||0)-(parseInt(y.replace(/\D/g,''))||0));
  keys.forEach(key=>{
    const link=VIDEOS[key],id=driveId(link),yt=ytUrl(link);
    let box;
    if(id){
      /* custom player fed by Drive's direct-download URL; falls back to Drive's own player if it can't load */
      const direct='https://drive.usercontent.google.com/download?id='+id+'&export=download&confirm=t';
      let failed=false;
      box=makeCustom(direct,()=>{
        if(failed)return;failed=true;
        const fb=makeFrame('https://drive.google.com/file/d/'+id+'/preview',key);
        box.replaceWith(fb);
      });
    }else if(yt){
      box=makeFrame(yt,key);
    }else{
      box=makeCustom(link);
    }
    grid.appendChild(box);
  });
  wirePlayers(grid);autoplayAll();
}
buildVideos();

</script>
